# BAJOGO ERP — Nginx site
# Copy to /etc/nginx/sites-available/bajogo-erp and link into sites-enabled.
# Replace erp.example.com with your subdomain and 4100 with the API port in .env.
# Your other applications keep their own files in sites-available, each with its own server_name.
# Certbot adds the HTTPS (443) block and certificate lines when you run it.

server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;

    root /srv/bajogo-erp/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    # API: passed to the Node process listening on 127.0.0.1 only.
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API documentation is for developers. Keep it off the public site.
    location /api/docs {
        return 404;
    }

    # Built assets have hashed names, so they can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path loads index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
