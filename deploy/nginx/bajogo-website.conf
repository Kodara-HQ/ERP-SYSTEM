# BAJOGO ENTERPRISE public website — Nginx site
# Copy to /etc/nginx/sites-available/bajogo-website and link into sites-enabled.
# Replace example.com with the company domain and 4100 with the API port in .env.
#
# The website uses the same API process as the ERP. Only the public website routes
# (/api/v1/public/...) are reachable on this domain; the staff API stays on the ERP subdomain.
# Certbot adds the HTTPS (443) blocks and certificate lines when you run it.

# Send the bare domain to www so there is one address for search engines.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://www.example.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;

    root /srv/bajogo-erp/website/dist;
    index index.html;

    # Job applications can carry a CV (sent as base64, up to about 8 MB).
    client_max_body_size 10m;

    # Public website API only.
    location /api/v1/public/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else under /api (staff login, ERP data, API docs) is not served here.
    location /api/ {
        return 404;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4100/api/v1/public/website/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:4100/api/v1/public/website/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built assets have hashed names, so they can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /brand/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Single-page app: every other path loads index.html.
    # Headers are repeated here because an add_header in a location replaces the server-level ones.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
